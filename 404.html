<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Remote Control System...</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 2rem;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            margin: 1rem 0;
            font-size: 1.5rem;
        }
        p {
            color: #8b949e;
            margin: 0.5rem 0;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .progress-bar {
            width: 100%;
            height: 2px;
            background: #30363d;
            margin-top: 2rem;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            width: 30%;
            height: 100%;
            background: #58a6ff;
            animation: progress 1s ease-out forwards;
        }
        @keyframes progress {
            to { width: 100%; }
        }
    </style>
    <script>
        (function() {
            var fullPath = window.location.pathname;
            var pathParts = fullPath.split('/');
            var basePath = '';
            var route = '';
            var repoNames = ['remote-control-system', 'remote-control-spa', 'rcs'];
            
            if (pathParts.length > 1 && repoNames.indexOf(pathParts[1]) !== -1) {
                basePath = '/' + pathParts[1];
                route = pathParts.slice(2).join('/');
            } else {
                route = pathParts.slice(1).join('/');
            }
            
            route = route.replace(/\/$/, '');
            if (route === '' || route === 'index.html') {
                route = 'home';
            } else if (route.indexOf('.html') !== -1) {
                route = route.replace('.html', '');
            }
            
            sessionStorage.setItem('redirectRoute', route);
            
            setTimeout(function() {
                window.location.replace(basePath + '/index.html#' + route);
            }, 500);
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Redirecting to Remote Control System</h2>
        <p>Please wait while we redirect you to the application...</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <p style="margin-top: 1rem; font-size: 0.85rem;">
            If you are not redirected automatically, 
            <a href="#" id="manualLink">click here</a>.
        </p>
    </div>
    <script>
        var basePath = window.location.pathname.split('/').slice(0,2).join('/');
        document.getElementById('manualLink').href = basePath + '/index.html';
    </script>
</body>
</html>
